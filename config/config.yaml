data:
  raw_path: "data/raw/m5_walmart"
  processed_path: "data/processed"
  test_size: 0.2
  validation_size: 0.15

features:
  input_features:
    - sales_log
    - sales_ma7
    - sales_growth
    - cost
    - inventory
    - inventory_ratio
    - has_promo
    - promo_intensity
    - seasonality_index
    - elasticity
    - elasticity_magnitude
    - competitor_price
    - price_gap
    - category_encoded
  target: "price"
  categorical_features:
    - category_encoded
  numerical_features:
    - sales_log
    - sales_ma7
    - sales_growth
    - cost
    - inventory
    - inventory_ratio
    - promo_intensity
    - seasonality_index
    - elasticity
    - elasticity_magnitude
    - competitor_price
    - price_gap

model:
  type: "xgboost"
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    min_child_weight: 3
    gamma: 0.1

explainability:
  shap_background_samples: 100
  lime_num_features: 8

llm:
  provider: "mock"
  model: "mock"
  max_tokens: 300
  temperature: 0.3

confidence:
  uncertainty_threshold: 0.15

business_rules:
  min_price: 0.5
  max_price: 100
  max_price_increase_pct: 0.20
  max_price_decrease_pct: 0.15

experiment_tracking:
  log_dir: "experiments/logs"
  save_model: true